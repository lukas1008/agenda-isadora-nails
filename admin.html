<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ADM</title>
    <style>
        /* Cores de fundo e fontes idênticas ao print */
        body { 
            background-color: #0b0d17; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px 16px; 
            margin: 0; 
        }

        /* Topo do Painel */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 4px;
        }

        .brand-title {
            color: #3b82f6;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .btn-sair {
            color: #94a3b8;
            font-size: 14px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Menu de Navegação Superior em Grade (2x2) */
        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .nav-button {
            background-color: #111422;
            border: 1px solid #1e2235;
            color: #94a3b8;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        /* Cor Roxa/Azul do Botão Selecionado */
        .nav-button.active {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: #ffffff;
            border: none;
        }

        /* Seções de Exibição */
        .secao-conteudo {
            display: none;
        }

        .secao-conteudo.active {
            display: block;
        }

        /* Textos Principais */
        .main-title {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 4px 0;
        }

        .sub-title {
            color: #64748b;
            font-size: 14px;
            margin: 0 0 25px 0;
        }

        /* Caixas de Estatísticas Grandes (Dashboard) */
        .stat-container {
            background-color: #111422;
            border: 1px solid #1e2235;
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .bg-blue-icon { background-color: #1d2d44; color: #3b82f6; }
        .bg-green-icon { background-color: #132d24; color: #10b981; }

        .stat-details {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            margin-top: 2px;
        }

        /* Seção Próximos Atendimentos */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #3b82f6;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 30px 0 15px 0;
            text-transform: uppercase;
        }

        /* Cards de Agendamentos / Listagens */
        .card-atendimento {
            background-color: #111422;
            border: 1px solid #1e2235;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .card-atendimento .cliente-nome {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .card-atendimento .info-linha {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .card-atendimento .info-linha strong {
            color: #e2e8f0;
        }

        /* Texto de Carregamento Solitário */
        .loading-box {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <!-- Topo IDÊNTICO ao print -->
    <div class="header-top">
        <div class="brand-title">
            <span>🔹 Painel ADM</span>
        </div>
        <a href="#" class="btn-sair">🔄 Sair</a>
    </div>

    <!-- Menu em Grade 2x2 com os nomes exatos -->
    <div class="nav-grid">
        <button id="btn-dashboard" class="nav-button active" onclick="alternarTela('dashboard')">📊 Dashboard</button>
        <button id="btn-agendamentos" class="nav-button" onclick="alternarTela('agendamentos')">📅 Agendamentos</button>
        <button id="btn-clientes" class="nav-button" onclick="alternarTela('clientes')">👥 Clientes</button>
        <button id="btn-servicos" class="nav-button" onclick="alternarTela('servicos')">🪮 Serviços</button>
    </div>

    <!-- TELA 1: DASHBOARD -->
    <div id="tela-dashboard" class="secaoconteudo active">
        <h2 class="main-title">Dashboard</h2>
        <p class="sub-title">Visão geral do seu salão</p>

        <!-- Caixa 1: Agendamentos Ativos -->
        <div class="stat-container">
            <div class="stat-icon bg-blue-icon">📅</div>
            <div class="stat-details">
                <span class="stat-label">Agendamentos Ativos</span>
                <span id="txt-ativos" class="stat-value">Carregando...</span>
            </div>
        </div>

        <!-- Caixa 2: Faturamento Estimado -->
        <div class="stat-container">
            <div class="stat-icon bg-green-icon">$</div>
            <div class="stat-details">
                <span class="stat-label">Faturamento Estimado</span>
                <span id="txt-faturamento" class="stat-value">R$ 0,00</span>
            </div>
        </div>

        <!-- Título Próximos Atendimentos -->
        <div class="section-divider">
            <span>🕒 Próximos Atendimentos</span>
        </div>

        <!-- Lista dinâmica abaixo do Dashboard -->
        <div id="lista-dashboard-atendimentos">
            <div class="loading-box">Buscando dados no banco...</div>
        </div>
    </div>

    <!-- TELA 2: AGENDAMENTOS COMPLETO -->
    <div id="tela-agendamentos" class="secaoconteudo">
        <h2 class="main-title">Agendamentos</h2>
        <p class="sub-title">Lista Geral de Horários</p>
        <div id="lista-completa-agendamentos"></div>
    </div>

    <!-- TELA 3: CLIENTES -->
    <div id="tela-clientes" class="secaoconteudo">
        <h2 class="main-title">Clientes</h2>
        <p class="sub-title">Histórico de Clientes Cadastradas</p>
        <div id="lista-completa-clientes"></div>
    </div>

    <!-- TELA 4: SERVIÇOS -->
    <div id="tela-servicos" class="secaoconteudo">
        <h2 class="main-title">Serviços</h2>
        <p class="sub-title">Serviços Oferecidos</p>
        <div id="lista-completa-servicos"></div>
    </div>

    <script>
        const DB_URL = "https://htdgxhgnjiqvktunspbx.supabase.co";
        const DB_KEY = "sb_publishable_17WMOi7ShX6Mhe_LJT-mwg_Gheub-a3";

        // Gerencia a troca de abas perfeitamente
        function alternarTela(tela) {
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.secaoconteudo').forEach(s => s.classList.remove('active'));

            document.getElementById('btn-' + tela).classList.add('active');
            document.getElementById('tela-' + tela).classList.add('active');
        }

        window.onload = function() {
            carregarSupabase();
        };

        async function carregarSupabase() {
            try {
                const resposta = await fetch(`${DB_URL}/rest/v1/agendamentos?select=*&order=data.asc`, {
                    method: 'GET',
                    headers: { 
                        'apikey': DB_KEY, 
                        'Authorization': `Bearer ${DB_KEY}`, 
                        'Content-Type': 'application/json' 
                    }
                });
                const dados = await resposta.json();

                if (dados && dados.length > 0) {
                    // 1. Atualizar contadores do Dashboard com os termos exatos do print
                    document.getElementById('txt-ativos').innerText = dados.length;
                    
                    let somaValor = 0;
                    dados.forEach(item => {
                        if(item.preco) {
                            const limpo = parseFloat(item.preco.replace('R$', '').replace(',', '.').trim());
                            if(!isNaN(limpo)) somaValor += limpo;
                        }
                    });
                    document.getElementById('txt-faturamento').innerText = 
                        somaValor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                    // 2. Renderizar os cards na aba Dashboard (Próximos Atendimentos)
                    const listaDash = document.getElementById('lista-dashboard-atendimentos');
                    listaDash.innerHTML = "";
                    
                    dados.forEach(item => {
                        const dataBR = item.data ? item.data.split('-').reverse().join('/') : '';
                        listaDash.innerHTML += `
                            <div class="card-atendimento">
                                <div class="cliente-nome">${item.cliente_nome || 'Sem nome'}</div>
                                <div class="info-linha">💅 <strong>Serviço:</strong> ${item.servico || '-'}</div>
                                <div class="info-linha">📅 <strong>Data:</strong> ${dataBR}</div>
                                <div class="info-linha">🕒 <strong>Horário:</strong> ${item.horario || '--:--'}</div>
                                <div class="info-linha">💵 <strong>Valor:</strong> ${item.preco || 'R$ 0,00'}</div>
                            </div>
                        `;
                    });

                    // Copia para a aba específica de Agendamentos
                    document.getElementById('lista-completa-agendamentos').innerHTML = listaDash.innerHTML;

                    // 3. Renderizar Clientes Unificadas
                    const listaClientes = document.getElementById('lista-completa-clientes');
                    listaClientes.innerHTML = "";
                    const unicos = [...new Set(dados.map(i => i.cliente_nome))].filter(Boolean);
                    unicos.forEach(nome => {
                        const total = dados.filter(i => i.cliente_nome === nome).length;
                        listaClientes.innerHTML += `
                            <div class="card-atendimento">
                                <div class="cliente-nome">${nome}</div>
                                <div class="info-linha">👤 Cliente Registrada • Atendida <strong>${total}</strong> vezes</div>
                            </div>
                        `;
                    });

                    // 4. Renderizar Serviços Disponíveis
                    const listaServicos = document.getElementById('lista-completa-servicos');
                    listaServicos.innerHTML = "";
                    const servicosUnicos = [...new Set(dados.map(i => i.servico))].filter(Boolean);
                    servicosUnicos.forEach(serv => {
                        listaServicos.innerHTML += `
                            <div class="card-atendimento">
                                <div class="cliente-nome">${serv}</div>
                                <div class="info-linha">⭐ Categoria ativa de procedimento</div>
                            </div>
                        `;
                    });
                } else {
                    // Estado vazio padrão
                    document.getElementById('txt-ativos').innerText = "0";
                    document.getElementById('lista-dashboard-atendimentos').innerHTML = '<div class="loading-box">Nenhum atendimento agendado.</div>';
                }
            } catch (erro) {
                console.error(erro);
                document.getElementById('txt-ativos').innerText = "Erro";
                document.getElementById('lista-dashboard-atendimentos').innerHTML = '<div class="loading-box" style="color: #ef4444;">Erro ao conectar com o banco.</div>';
            }
        }
    </script>
</body>
</html>
