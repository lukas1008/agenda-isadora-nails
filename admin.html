<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Isadora Nails</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #ff69b4;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        th {
            background-color: #fff0f5;
            color: #ff69b4;
        }
        .status-pendente {
            color: orange;
            font-weight: bold;
        }
        .btn-acao {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
        }
        .btn-aprovar { background-color: #28a745; color: white; }
        .btn-cancelar { background-color: #dc3545; color: white; }
        
        .menu-admin {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .menu-admin a {
            text-decoration: none;
            color: #666;
            font-size: 14px;
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Painel Administrativo</h1>
    </header>

    <div class="admin-container">
        <div class="menu-admin">
            <a href="index.html">Sair</a>
            <a href="#">Configurações</a>
            <a href="#">Clientes</a>
        </div>

        <h2>Agendamentos do Dia</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Serviço</th>
                    <th>Horário</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Maria Oliveira</td>
                    <td>Manicure</td>
                    <td>09:00</td>
                    <td class="status-pendente">Pendente</td>
                    <td>
                        <button class="btn-acao btn-aprovar">Ok</button>
                        <button class="btn-acao btn-cancelar">X</button>
                    </td>
                </tr>
                <tr>
                    <td>Ana Souza</td>
                    <td>Gel</td>
                    <td>10:30</td>
                    <td class="status-pendente">Pendente</td>
                    <td>
                        <button class="btn-acao btn-aprovar">Ok</button>
                        <button class="btn-acao btn-cancelar">X</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
