<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Isadora Nails</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        header { background-color: #000; border-bottom: 3px solid #0056b3; padding: 20px; text-align: center; }
        header h1 { margin: 0; color: #007bff; }
        .admin-container { max-width: 900px; margin: 20px auto; background: #1e1e1e; padding: 20px; border-radius: 10px; border: 1px solid #2d2d2d; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #2d2d2d; }
        th { color: #007bff; background-color: #121212; }
        .btn-excluir { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; }
        .btn-excluir:hover { background-color: #bd2130; }
        .btn-whatsapp { background-color: #25d366; color: white; padding: 6px 12px; border-radius: 3px; text-decoration: none; font-size: 12px; font-weight: bold; display: inline-block; }
        .btn-whatsapp:hover { background-color: #1ebe5d; }
        .menu { margin-bottom: 20px; }
        .menu button { padding: 8px 15px; background: #121212; color: #aaa; border: 1px solid #2d2d2d; border-radius: 5px; cursor: pointer; }
        .menu button:hover { color: white; background-color: #2d2d2d; }
    </style>
</head>
<body>

    <header>
        <h1>Painel Administrativo</h1>
    </header>

    <div class="admin-container">
        <div class="menu">
            <button onclick="fazerLogout()">Sair do Painel</button>
        </div>

        <h2>Agendamentos na Nuvem</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>WhatsApp</th>
                    <th>Serviço</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                <tr><td colspan="6" style="text-align:center;">Carregando...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = "https://htdgxhgnjiqvktunspbx.supabase.com";
        const SUPABASE_KEY = "sb_publishable_17WMOi7ShX6Mhe_LJT-mwg_Gheub-a3";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: false }
        });

        async function carregarAgendamentos() {
            const tabela = document.getElementById("tabelaCorpo");
            try {
                const { data: agendamentos, error } = await _supabase
                    .from('agendamentos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                tabela.innerHTML = "";
                if (agendamentos.length === 0) {
                    tabela.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Nenhum agendamento encontrado.</td></tr>";
                    return;
                }

                agendamentos.forEach(a => {
                    const tr = document.createElement("tr");
                    const numeroLimpo = a.whatsapp ? a.whatsapp.replace(/\D/g,'') : '';
                    const linkWhats = numeroLimpo 
                        ? `<a href="https://wa.me/55${numeroLimpo}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>` 
                        : 'Não informado';
                    
                    tr.innerHTML = `
                        <td><strong>${a.cliente_nome}</strong></td>
                        <td>${linkWhats}</td>
                        <td>${a.servico} ${a.preco ? ' - ' + a.preco : ''}</td>
                        <td>${a.data}</td>
                        <td>${a.horario}</td>
                        <td><button class="btn-excluir" onclick="excluir('${a.id}')">Excluir</button></td>
                    `;
                    tabela.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                tabela.innerHTML = "<tr><td colspan='6' style='text-align:center; color:red;'>Erro ao carregar dados. Verifique a permissão no Supabase!</td></tr>";
            }
        }

        async function excluir(id) {
            if(confirm("Deseja realmente excluir este agendamento?")) {
                try {
                    const { error } = await _supabase.from('agendamentos').delete().eq('id', id);
                    if (error) throw error;
                    carregarAgendamentos();
                } catch (err) {
                    alert("Erro ao excluir agendamento.");
                }
            }
        }

        function fazerLogout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.onload = function() {
            // Verifica se o usuário logado é você mesma pelo e-mail cadastrado
            if (localStorage.getItem("usuarioLogado") !== "isadoragomes.luk@gmail.com") {
                alert("Acesso negado.");
                window.location.href = "login.html";
            } else {
                carregarAgendamentos();
            }
        };
    </script>
</body>
</html>
