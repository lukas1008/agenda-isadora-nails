<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Isadora Nails</title>
    <!-- Script para carregar a conexão direta do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #000000;
            border-bottom: 3px solid #0056b3;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            color: #007bff;
            letter-spacing: 1px;
        }
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #2d2d2d;
        }
        h2 {
            color: white;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #2d2d2d;
            font-size: 14px;
        }
        th {
            background-color: #121212;
            color: #007bff;
        }
        .btn-acao {
            padding: 6px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
            font-weight: bold;
        }
        .btn-cancelar { 
            background-color: #dc3545; 
            color: white; 
        }
        .btn-cancelar:hover {
            background-color: #c82333;
        }
        .btn-whatsapp-cliente {
            background-color: #25d366;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }
        .btn-whatsapp-cliente:hover {
            opacity: 0.9;
        }
        .menu-admin {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .menu-admin button {
            text-decoration: none;
            color: #aaa;
            font-size: 14px;
            padding: 8px 15px;
            border: 1px solid #2d2d2d;
            background-color: #121212;
            border-radius: 5px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .menu-admin button:hover {
            color: white;
            border-color: #dc3545;
            background-color: #dc3545;
        }
        .sem-agendamentos {
            text-align: center;
            padding: 30px;
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Painel Administrativo</h1>
    </header>

    <div class="admin-container">
        <div class="menu-admin">
            <button onclick="fazerLogout()">Sair do Painel</button>
        </div>

        <h2>Agendamentos Recebidos</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>WhatsApp</th>
                    <th>Serviço</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
            </tbody>
        </table>
    </div>

    <script>
        // Inicialização do Supabase
        const SUPABASE_URL = "https://htdgxhgnjiqvktunspbx.supabase.com";
        const SUPABASE_KEY = "sb_publishable_17WMOi7ShX6Mhe_LJT-mwg_Gheub-a3";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarAgendamentos() {
            const tabelaCorpo = document.getElementById("tabelaCorpo");
            tabelaCorpo.innerHTML = "<tr><td colspan='6' class='sem-agendamentos'>Carregando agendamentos...</td></tr>";

            try {
                // Puxa todos os dados ordenados por data de inserção
                const { data: agendamentos, error } = await _supabase
                    .from('agendamentos')
                    .select('*')
                    .order('criado_em', { ascending: false });

                if (error) throw error;

                tabelaCorpo.innerHTML = "";

                if (!agendamentos || agendamentos.length === 0) {
                    tabelaCorpo.innerHTML = `<tr><td colspan="6" class="sem-agendamentos">Nenhum agendamento realizado ainda.</td></tr>`;
                    return;
                }

                agendamentos.forEach(agendamento => {
                    const tr = document.createElement("tr");
                    
                    let numeroFormatado = agendamento.whatsapp ? agendamento.whatsapp.replace(/\D/g, '') : '';
                    if (numeroFormatado.length === 11 || numeroFormatado.length === 10) {
                        numeroFormatado = "55" + numeroFormatado;
                    }

                    const botaoWhatsapp = numeroFormatado 
                        ? `<a href="https://wa.me/${numeroFormatado}" target="_blank" class="btn-whatsapp-cliente">💬 ${agendamento.whatsapp}</a>`
                        : '<span style="color: #aaa; font-style: italic;">Não informado</span>';

                    tr.innerHTML = `
                        <td>${agendamento.cliente_nome}</td>
                        <td>${botaoWhatsapp}</td>
                        <td>${agendamento.servico} ${agendamento.preco ? '- ' + agendamento.preco : ''}</td>
                        <td>${agendamento.data}</td>
                        <td>${agendamento.horario}</td>
                        <td>
                            <button class="btn-acao btn-cancelar" onclick="removerAgendamento('${agendamento.id}')">Excluir</button>
                        </td>
                    `;

                    tabelaCorpo.appendChild(tr);
                });

            } catch (err) {
                console.error(err);
                tabelaCorpo.innerHTML = "<tr><td colspan='6' class='sem-agendamentos' style='color: #dc3545;'>Falha ao carregar agendamentos da nuvem.</td></tr>";
            }
        }

        async function removerAgendamento(id) {
            if (confirm("Tem certeza que deseja excluir esse agendamento?")) {
                try {
                    const { error } = await _supabase
                        .from('agendamentos')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;

                    carregarAgendamentos();
                } catch (err) {
                    console.error(err);
                    alert("Erro ao excluir o agendamento no servidor.");
                }
            }
        }

        function fazerLogout() {
            localStorage.removeItem("usuarioLogado");
            window.location.href = "index.html";
        }

        window.onload = function() {
            if (localStorage.getItem("usuarioLogado") !== "isadoragomes.luk@gmail.com") {
                alert("Acesso restrito para administradores.");
                window.location.href = "login.html";
            } else {
                carregarAgendamentos();
            }
        };
    </script>

</body>
</html>
