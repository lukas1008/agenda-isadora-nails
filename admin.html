<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora Nails - Painel Administrativo</title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-principal: #090a0f;
            --bg-card: #121420;
            --cor-primaria: #2563eb;
            --cor-secundaria: #7c3aed;
            --texto-claro: #ffffff;
            --texto-cinza: #94a3b8;
            --neon-azul: #3b82f6;
            --border-color: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Menu Lateral (Sidebar) */
        .sidebar {
            width: 260px;
            background-color: #0b0c13;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 24px;
            color: var(--neon-azul);
            filter: drop-shadow(0 0 8px var(--neon-azul));
        }

        .logo-texto h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .logo-texto span {
            font-size: 12px;
            color: var(--neon-azul);
            font-weight: 500;
            letter-spacing: 2px;
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            color: var(--texto-cinza);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            color: white;
            background: linear-gradient(135deg, var(--cor-primaria), var(--cor-secundaria));
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        /* Perfil rodapé do menu */
        .perfil-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .perfil-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-azul);
        }

        .perfil-info h4 {
            font-size: 13px;
            font-weight: 700;
        }

        .perfil-info span {
            font-size: 11px;
            color: var(--texto-cinza);
        }

        /* Área do Conteúdo Principal */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
            min-height: 100vh;
        }

        /* Topo do Dashboard */
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .dash-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .dash-header p {
            font-size: 14px;
            color: var(--texto-cinza);
        }

        /* Grid de Cards superiores */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .card-metrica {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .card-icone-bg {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .bg-roxo { background: rgba(124, 58, 237, 0.1); color: var(--cor-secundaria); }
        .bg-verde { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
        .bg-azul { background: rgba(59, 130, 246, 0.1); color: var(--neon-azul); }
        .bg-rosa { background: rgba(236, 72, 153, 0.1); color: #ec4899; }

        .card-info span {
            font-size: 13px;
            color: var(--texto-cinza);
            display: block;
            margin-bottom: 4px;
        }

        .card-info h3 {
            font-size: 24px;
            font-weight: 700;
        }

        /* Grid de Seções de Baixo */
        .secoes-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 24px;
        }

        /* Caixa de Próximos Agendamentos */
        .secao-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
        }

        .secao-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .secao-titulo {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .secao-titulo i {
            color: var(--neon-azul);
        }

        /* Lista de Clientes Agendados */
        .agendamentos-lista {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cliente-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .cliente-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .cliente-perfil {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-inicial {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        /* Paleta de cores aleatórias para as bolinhas das clientes */
        .av-1 { background-color: #ec4899; }
        .av-2 { background-color: #3b82f6; }
        .av-3 { background-color: #8b5cf6; }
        .av-4 { background-color: #f59e0b; }

        .cliente-nome h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .cliente-nome span {
            font-size: 11px;
            color: var(--texto-cinza);
        }

        .meta-dados {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--texto-cinza);
        }

        /* Status Badge */
        .status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: capitalize;
        }

        .status-concluido { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
        .status-pendente { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }

        /* Responsivo Básicos para Celulares */
        @media (max-width: 1024px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; padding: 16px; border-bottom: 1px solid var(--border-color); border-right: none; }
            .logo-container { margin-bottom: 16px; }
            .menu-links { flex-direction: row; flex-wrap: wrap; }
            .perfil-footer { display: none; }
            .main-content { margin-left: 0; padding: 20px; }
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            .secoes-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <div class="sidebar">
        <div>
            <div class="logo-container">
                <div class="logo-icon"><i class="fa-solid fa-bottle-droplet"></i></div>
                <div class="logo-texto">
                    <h1>ISADORA</h1>
                    <span>NAILS</span>
                </div>
            </div>

            <nav class="menu-links">
                <a href="#" class="menu-item active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-calendar-days"></i> Agendamentos</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-users"></i> Clientes</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-sparkles"></i> Serviços</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-wallet"></i> Financeiro</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-chart-line"></i> Relatórios</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-gears"></i> Configurações</a>
            </nav>
        </div>

        <div class="perfil-footer">
            <!-- Coloque uma foto sua ou ícone aqui depois se desejar -->
            <img class="perfil-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Avatar Isadora">
            <div class="perfil-info">
                <h4>Isadora</h4>
                <span>Administradora</span>
            </div>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        
        <div class="dash-header">
            <div>
                <h2>Dashboard</h2>
                <p>Visão geral do seu salão</p>
            </div>
        </div>

        <!-- Cards de Métricas -->
        <div class="cards-grid">
            <div class="card-metrica">
                <div class="card-icone-bg bg-roxo"><i class="fa-regular fa-calendar"></i></div>
                <div class="card-info">
                    <span>Agendamentos</span>
                    <h3 id="metric-agendamentos">0</h3>
                </div>
            </div>
            <div class="card-metrica">
                <div class="card-icone-bg bg-verde"><i class="fa-solid fa-dollar-sign"></i></div>
                <div class="card-info">
                    <span>Faturamento</span>
                    <h3 id="metric-faturamento">R$ 0,00</h3>
                </div>
            </div>
            <div class="card-metrica">
                <div class="card-icone-bg bg-azul"><i class="fa-solid fa-user-group"></i></div>
                <div class="card-info">
                    <span>Clientes</span>
                    <h3 id="metric-clientes">0</h3>
                </div>
            </div>
            <div class="card-metrica">
                <div class="card-icone-bg bg-rosa"><i class="fa-solid fa-hand-holding-dollar"></i></div>
                <div class="card-info">
                    <span>Lucro Líquido</span>
                    <h3 id="metric-lucro">R$ 0,00</h3>
                </div>
            </div>
        </div>

        <!-- Parte Inferior -->
        <div class="secoes-grid">
            
            <!-- Próximos Agendamentos (Puxado do Banco de Dados) -->
            <div class="secao-box">
                <div class="secao-header">
                    <div class="secao-titulo">
                        <i class="fa-regular fa-clock"></i> Próximos Agendamentos
                    </div>
                </div>

                <div class="agendamentos-lista" id="lista-agendamentos">
                    <!-- Gerado dinamicamente via JS -->
                    <p style="color: var(--texto-cinza); font-size: 14px;">Carregando dados do banco de dados...</p>
                </div>
            </div>

        </div>

    </div>

    <script>
        // Configurações do Supabase puxadas do seu arquivo original
        const SUPABASE_URL = "https://htdgxhgnjiqvktunspbx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_17WMOi7ShX6Mhe_LJT-mwg_Gheub-a3";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: false }
        });

        async function carregarDashboard() {
            try {
                // 1. Puxa os dados dos agendamentos
                const { data: agendamentos, error } = await _supabase
                    .from('agendamentos')
                    .select('*')
                    .order('data', { ascending: true });

                if (error) throw error;

                // Elemento da lista de agendamentos
                const listaHTML = document.getElementById('lista-agendamentos');
                listaHTML.innerHTML = '';

                if (!agendamentos || agendamentos.length === 0) {
                    listaHTML.innerHTML = `<p style="color: var(--texto-cinza); font-size: 14px;">Nenhum agendamento encontrado.</p>`;
                    return;
                }

                // Paleta de classes para as bolinhas de avatares
                const classesAvatares = ['av-1', 'av-2', 'av-3', 'av-4'];

                // 2. Calcula Métricas Reais
                let totalAgendamentos = agendamentos.length;
                let totalFaturamento = 0;
                let clientesUnicas = new Set();

                agendamentos.forEach((ag, index) => {
                    // Soma Faturamento (Remove "R$" e limpa espaços)
                    if(ag.preco) {
                        const valorLimpo = parseFloat(ag.preco.replace('R$', '').replace(',', '.').trim());
                        if(!isNaN(valorLimpo)) totalFaturamento += valorLimpo;
                    }
                    
                    // Conta clientes únicas
                    if(ag.cliente_nome) clientesUnicas.add(ag.cliente_nome.toLowerCase().trim());

                    // Renderiza os itens na tela (limita aos 5 próximos)
                    if (index < 5) {
                        const inicialCliente = ag.cliente_nome ? ag.cliente_nome.charAt(0).toUpperCase() : 'C';
                        const avatarClasse = classesAvatares[index % classesAvatares.length];
                        const dataFormatada = ag.data ? ag.data.split('-').reverse().join('/') : '--/--/----';
                        const statusTexto = ag.status || 'pendente';
                        const statusClasse = statusTexto === 'concluido' ? 'status-concluido' : 'status-pendente';

                        listaHTML.innerHTML += `
                            <div class="cliente-item">
                                <div class="cliente-perfil">
                                    <div class="avatar-inicial ${avatarClasse}">${inicialCliente}</div>
                                    <div class="cliente-nome">
                                        <h4>${ag.cliente_nome || 'Cliente Anônima'}</h4>
                                        <span>${ag.servico || 'Não especificado'}</span>
                                    </div>
                                </div>
                                <div class="meta-dados">
                                    <div class="meta-item"><i class="fa-regular fa-calendar"></i> ${dataFormatada}</div>
                                    <div class="meta-item"><i class="fa-regular fa-clock"></i> ${ag.horario || '--:--'}</div>
                                    <span class="status-badge ${statusClasse}">${statusTexto}</span>
                                </div>
                            </div>
                        `;
                    }
                });

                // 3. Atualiza os números nos Cards de Cima
                document.getElementById('metric-agendamentos').innerText = totalAgendamentos;
                document.getElementById('metric-faturamento').innerText = `R$ ${totalFaturamento.toFixed(2).replace('.', ',')}`;
                document.getElementById('metric-clientes').innerText = clientesUnicas.size;
                // Lucro líquido fictício baseado em 70% do faturamento real (você pode alterar a lógica depois)
                document.getElementById('metric-lucro').innerText = `R$ ${(totalFaturamento * 0.7).toFixed(2).replace('.', ',')}`;

            } catch (err) {
                console.error("Erro ao processar dados do Dashboard:", err);
                document.getElementById('lista-agendamentos').innerHTML = `
                    <p style="color: #ef4444; font-size: 14px;">
                        <i class="fa-solid fa-triangle-exclamation"></i> Erro ao carregar dados do banco de dados.
                    </p>
                `;
            }
        }

        // Executa ao abrir a página
        window.onload = carregarDashboard;
    </script>
</body>
</html>
