<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
    </style>
</head>
<body>
    <h1>Painel de Agendamentos</h1>
    <table>
        <thead>
            <tr><th>Cliente</th><th>Serviço</th><th>Data</th><th>Horário</th></tr>
        </thead>
        <tbody id="listaAgendamentos"></tbody>
    </table>

    <script>
        const lista = JSON.parse(localStorage.getItem('agendamentos') || '[]');
        const tabela = document.getElementById('listaAgendamentos');
        
        lista.forEach(item => {
            tabela.innerHTML += `<tr><td>${item.cliente}</td><td>${item.servico}</td><td>${item.data}</td><td>${item.hora}</td></tr>`;
        });
    </script>
</body>
</html>
