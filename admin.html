<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Isadora Nails</title>
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: sans-serif; padding: 15px; margin: 0; }
        h1 { font-size: 20px; margin-bottom: 5px; }
        p.sub { color: #8892b0; font-size: 12px; margin: 0 0 20px 0; }
        .menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 15px; background: #1e293b; border: 2px solid #334155; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
        .btn.active { background: #2563eb; border-color: #3b82f6; }
        .secao { display: none; background: #111827; border: 1px solid #1f2937; padding: 15px; border-radius: 8px; }
        .secao.active { display: block; }
        .card { background: #1f2937; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #f59e0b; }
        .card.confirmado { border-left-color: #10b981; }
        .card.cancelado { border-left-color: #ef4444; }
        .nome { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .info { font-size: 13px; color: #9ca3af; line-height: 1.4; }
        .status-erro { background: #7f1d1d; border: 1px solid #f87171; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px; }
        .btn-acao { border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; margin-top: 10px; cursor: pointer; color: white; }
        .btn-confirmar { background: #10b981; }
        .btn-cancelar { background: #ef4444; margin-left: 5px; }
    </style>
</head>
<body>

    <h1>ISADORA NAILS</h1>
    <p class="sub">Painel Administrativo Simplificado</p>

    <div class="menu">
        <button id="btn-agenda" class="btn active" onclick="trocarAba('agenda')">Agendamentos</button>
        <button id="btn-cli" class="btn" onclick="trocarAba('cli')">Clientes</button>
    </div>

    <div id="alertas"></div>

    <div id="sec-agenda" class="secao active">
        <h3 style="margin:0 0 10px 0;">Todos os Pedidos</h3>
        <div id="lista-agenda">
            <p style="color: #9ca3af;">Conectando ao Supabase...</p>
        </div>
    </div>

    <div id="sec-cli" class="secao">
        <h3 style="margin:0 0 10px 0;">Lista de Clientes</h3>
        <div id="lista-cli">
            <p style="color: #9ca3af;">Carregando clientes...</p>
        </div>
    </div>

    <script>
        const DB_URL = "https://htdgxhgnjiqvktunspbx.supabase.co";
        const DB_KEY = "sb_publishable_17WMOi7ShX6Mhe_LJT-mwg_Gheub-a3";

        function trocarAba(nome) {
            document.getElementById('btn-agenda').classList.remove('active');
            document.getElementById('btn-cli').classList.remove('active');
            document.getElementById('sec-agenda').classList.remove('active');
            document.getElementById('sec-cli').classList.remove('active');

            if (nome === 'agenda') {
                document.getElementById('btn-agenda').classList.add('active');
                document.getElementById('sec-agenda').classList.add('active');
            } else {
                document.getElementById('btn-cli').classList.add('active');
                document.getElementById('sec-cli').classList.add('active');
            }
        }

        window.onload = function() {
            carregarDados();
        };

        async function carregarDados() {
            try {
                const res = await fetch(`${DB_URL}/rest/v1/agendamentos?select=*&order=data.asc`, {
                    method: 'GET',
                    headers: {
                        'apikey': DB_KEY,
                        'Authorization': `Bearer ${DB_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!res.ok) throw new Error(`Erro do servidor: ${res.status}`);
                const dados = await res.json();

                if (!dados || dados.length === 0) {
                    document.getElementById('lista-agenda').innerHTML = "<p>Nenhum registro encontrado.</p>";
                    document.getElementById('lista-cli').innerHTML = "<p>Nenhuma cliente encontrada.</p>";
                    return;
                }

                renderizarAgenda(dados);
                renderizarClientes(dados);

            } catch (err) {
                console.error(err);
                document.getElementById('alertas').innerHTML = `
                    <div class="status-erro">
                        <strong>Erro de Conexão:</strong> ${err.message}
                    </div>
                `;
                document.getElementById('lista-agenda').innerHTML = "<p style='color: #ef4444;'>Falha ao carregar.</p>";
                document.getElementById('lista-cli').innerHTML = "<p style='color: #ef4444;'>Falha ao carregar.</p>";
            }
        }

        function renderizarAgenda(dados) {
            const container = document.getElementById('lista-agenda');
            container.innerHTML = "";
            dados.forEach(item => {
                const status = String(item.status || 'Pendente').toLowerCase();
                let clStatus = "";
                if (status === 'confirmado') clStatus = "confirmado";
                if (status === 'cancelado') clStatus = "cancelado";
                const dataBR = item.data ? item.data.split('-').reverse().join('/') : '';

                container.innerHTML += `
                    <div class="card ${clStatus}">
                        <div class="nome">${item.cliente_nome || 'Sem Nome'}</div>
                        <div class="info">
                            <strong>Serviço:</strong> ${item.servico || '-'}<br>
                            <strong>Data:</strong> ${dataBR} às ${item.horario || '--:--'}<br>
                            <strong>Status:</strong> ${item.status || 'Pendente'}
                        </div>
                        ${status === 'pendente' ? `
                            <button class="btn-acao btn-confirmar" onclick="atualizar(${item.id}, 'Confirmado')">Confirmar</button>
                            <button class="btn-acao btn-cancelar" onclick="atualizar(${item.id}, 'Cancelar')">Cancelar</button>
                        ` : ''}
                    </div>
                `;
            });
        }

        function renderizarClientes(dados) {
            const container = document.getElementById('lista-cli');
            container.innerHTML = "";
            const unicos = [...new Set(dados.map(i => i.cliente_nome))].filter(Boolean);
            unicos.forEach(nome => {
                const total = dados.filter(i => i.cliente_nome === nome).length;
                container.innerHTML += `
                    <div class="card confirmado" style="border-left-width: 2px;">
                        <div class="nome">${nome}</div>
                        <div class="info">Total de visitas: ${total}</div>
                    </div>
                `;
            });
        }

        async function atualizar(id, status) {
            try {
                const res = await fetch(`${DB_URL}/rest/v1/agendamentos?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': DB_KEY,
                        'Authorization': `Bearer ${DB_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ status: status })
                });
                if (!res.ok) throw new Error("Erro ao atualizar.");
                alert("Atualizado com sucesso!");
                carregarDados();
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>
</html>
