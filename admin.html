<!-- Script de Integração ao Supabase -->
    <script>
        // CONFIGURAÇÕES DO SEU SUPABASE
        const SUPABASE_URL = "https://htdgxhgnjiqvktunspbx.supabase.co";
        
        // ATENÇÃO: Se a sua chave anon do Supabase começar com "eyJ...", substitua abaixo.
        // Se for a chave publishable padrão, mantenha esta:
        const SUPABASE_KEY = "sb_publishable_17WMOi7ShX6Mhe_LJT-mwg_Gheub-a3";
        
        let supabase = null;

        // Alternar entre abas (AGORA TOTALMENTE ISOLADA DE ERROS - VAI CLICAR E RESPONDER SEMPRE)
        function mudarAba(idAba) {
            try {
                const botoes = document.querySelectorAll('.menu-btn');
                botoes.forEach(btn => btn.classList.remove('active'));

                const secoes = document.querySelectorAll('.conteudo-secao');
                secoes.forEach(secao => secao.classList.remove('active'));

                const botaoAtivo = document.getElementById(`btn-${idAba}`);
                if (botaoAtivo) {
                    botaoAtivo.classList.add('active');
                }

                const secaoAtiva = document.getElementById(`aba-${idAba}`);
                if (secaoAtiva) {
                    secaoAtiva.classList.add('active');
                }
            } catch (e) {
                console.error("Erro ao mudar de aba:", e);
            }
        }

        // Ao carregar a página, inicializa e busca os dados
        document.addEventListener("DOMContentLoaded", () => {
            inicializarSupabase();
        });

        function inicializarSupabase() {
            try {
                if (typeof window.supabase === 'undefined') {
                    mostrarErroNaTela("A biblioteca do Supabase não foi carregada pelo navegador do seu celular. Verifique se você está com conexão de internet ou tente abrir em outro navegador.");
                    return;
                }

                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                    auth: { persistSession: false }
                });

                carregarDadosDoBanco();
            } catch(e) {
                mostrarErroNaTela("Falha ao inicializar o cliente do banco de dados: " + e.message);
            }
        }

        // Função principal que puxa tudo do Banco
        async function carregarDadosDoBanco() {
            try {
                if (!supabase) return;

                let { data: agendamentos, error } = await supabase
                    .from('agendamentos')
                    .select('*')
                    .order('data', { ascending: true })
                    .order('horario', { ascending: true });

                if (error) {
                    throw error;
                }

                if (!agendamentos || agendamentos.length === 0) {
                    mostrarSemDados();
                    return;
                }

                // Filtrando dados para o Dashboard e Métricas
                const ativos = agendamentos.filter(a => a.status !== 'Cancelado');
                const faturamentoTotal = ativos.reduce((total, a) => {
                    const valorLimpo = parseFloat(String(a.preco || '0').replace('R$', '').replace(',', '.').replace(/[^\d.-]/g, '').trim());
                    return total + (isNaN(valorLimpo) ? 0 : valorLimpo);
                }, 0);

                // Atualiza números do Dashboard
                document.getElementById('dash-total-agendamentos').textContent = ativos.length;
                document.getElementById('dash-faturamento').textContent = faturamentoTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                // Renderiza as listas
                renderizarDashboard(ativos);
                renderizarAgendamentos(agendamentos);
                renderizarClientes(agendamentos);

            } catch (err) {
                console.error("Erro crítico de conexão:", err);
                mostrarErroNaTela(err.message || err.details || JSON.stringify(err));
            }
        }

        // Exibe o erro de forma limpa diretamente dentro do aplicativo em vez de travar o menu
        function mostrarErroNaTela(mensagemOriginal) {
            let msgAmigavel = mensagemOriginal;
            
            // Traduzindo erros comuns do Supabase para te ajudar a identificar
            if (mensagemOriginal.includes("Failed to fetch") || mensagemOriginal.includes("TypeError")) {
                msgAmigavel = "Erro de Rede (Failed to fetch). O navegador do seu celular bloqueou a conexão com o banco de dados do Supabase. Desative bloqueadores de anúncios (AdBlock) ou tente usar o Wi-Fi/dados móveis.";
            } else if (mensagemOriginal.includes("401") || mensagemOriginal.includes("Invalid API key")) {
                msgAmigavel = "Chave de API Inválida (Erro 401). A sua chave 'SUPABASE_KEY' está incorreta ou expirou no painel do Supabase.";
            } else if (mensagemOriginal.includes("404") || mensagemOriginal.includes("relation") || mensagemOriginal.includes("does not exist")) {
                msgAmigavel = "Tabela Não Encontrada (Erro 404). A tabela chamada 'agendamentos' não foi criada ou está com o nome diferente no seu banco do Supabase.";
            }

            document.getElementById('dash-total-agendamentos').textContent = "Erro";
            document.getElementById('dash-faturamento').textContent = "R$ --";
            document.getElementById('dash-proximos-hoje').innerHTML = `
                <div class="sem-dados" style="color: #ef4444; padding: 20px; text-align: left; background: rgba(239, 68, 68, 0.05); border-radius: 12px; border: 1px solid rgba(239, 68, 68, 0.2);">
                    <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444; font-size: 24px; margin-bottom: 10px;"></i>
                    <strong style="display:block; margin-bottom: 5px;">Falha na Conexão:</strong>
                    <span style="font-size: 12px; line-height: 1.4; display:block;">${msgAmigavel}</span>
                </div>
            `;
        }

        // Exibe tela vazia caso não haja dados
        function mostrarSemDados() {
            const vaziaHtml = `
                <div class="sem-dados">
                    <i class="fa-regular fa-calendar-times"></i>
                    Nenhum agendamento encontrado no banco de dados.
                </div>
            `;
            document.getElementById('dash-proximos-hoje').innerHTML = vaziaHtml;
            document.getElementById('lista-geral-agendamentos').innerHTML = vaziaHtml;
            document.getElementById('dash-total-agendamentos').textContent = "0";
            document.getElementById('dash-faturamento').textContent = "R$ 0,00";
        }

        // Renderiza no Dashboard os próximos atendimentos
        function renderizarDashboard(lista) {
            const container = document.getElementById('dash-proximos-hoje');
            if(lista.length === 0) {
                container.innerHTML = `<div class="sem-dados">Nenhum agendamento ativo.</div>`;
                return;
            }

            container.innerHTML = "";
            lista.slice(0, 3).forEach(item => {
                container.innerHTML += criarCardHtml(item, false);
            });
        }

        // Renderiza na aba Geral todos os agendamentos
        function renderizarAgendamentos(lista) {
            const container = document.getElementById('lista-geral-agendamentos');
            container.innerHTML = "";
            lista.forEach(item => {
                container.innerHTML += criarCardHtml(item, true);
            });
        }

        // Renderiza na aba Clientes
        function renderizarClientes(lista) {
            const container = document.getElementById('lista-clientes');
            container.innerHTML = "";
            
            const nomesUnicos = [...new Set(lista.map(item => item.cliente_nome))].filter(Boolean);
            
            if(nomesUnicos.length === 0) {
                container.innerHTML = `<div class="sem-dados">Nenhuma cliente encontrada.</div>`;
                return;
            }

            nomesUnicos.forEach(nome => {
                const registrosCliente = lista.filter(item => item.cliente_nome === nome);
                const totalServicos = registrosCliente.length;
                const dadosContato = registrosCliente[0];
                const zapFormatado = dadosContato.whatsapp ? dadosContato.whatsapp.replace(/[^\d]/g, '') : '';

                container.innerHTML += `
                    <div class="agenda-item-card">
                        <div class="agenda-header">
                            <div>
                                <div class="cliente-nome">${nome}</div>
                                <span class="servico-tag">Cliente Ativa</span>
                            </div>
                        </div>
                        <div class="agenda-detalhes">
                            <span><i class="fa-solid fa-heart"></i> Total de Visitas: ${totalServicos}</span>
                            ${zapFormatado ? `
                            <span>
                                <i class="fa-brands fa-whatsapp" style="color: #25d366;"></i> 
                                <a href="https://wa.me/55${zapFormatado}" target="_blank">Enviar Mensagem</a>
                            </span>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        // Helper para montar a estrutura HTML do card de agendamento
        function criarCardHtml(item, mostrarBotoes) {
            const dataFormatada = item.data ? item.data.split('-').reverse().join('/') : '';
            const statusLower = String(item.status || 'Pendente').toLowerCase();
            const statusClass = statusLower === 'confirmado' ? 'status-confirmado' : (statusLower === 'cancelado' ? 'status-cancelado' : 'status-pendente');

            const exibirAcoes = mostrarBotoes && statusLower === 'pendente';
            const zapFormatado = item.whatsapp ? item.whatsapp.replace(/[^\d]/g, '') : '';

            return `
                <div class="agenda-item-card" id="card-${item.id}">
                    <div class="agenda-header">
                        <div>
                            <div class="cliente-nome">${item.cliente_nome || 'Sem Nome'}</div>
                            <span class="servico-tag">${item.servico || 'Serviço'}</span>
                        </div>
                        <span class="status-badge ${statusClass}">${item.status || 'Pendente'}</span>
                    </div>
                    <div class="agenda-detalhes">
                        <span><i class="fa-regular fa-calendar"></i> ${dataFormatada}</span>
                        <span><i class="fa-regular fa-clock"></i> ${item.horario || '--:--'}</span>
                        <span><i class="fa-solid fa-dollar-sign"></i> ${item.preco || 'R$ 0,00'}</span>
                        ${zapFormatado ? `
                        <span>
                            <i class="fa-brands fa-whatsapp" style="color: #25d366;"></i> 
                            <a href="https://wa.me/55${zapFormatado}" target="_blank">WhatsApp</a>
                        </span>` : ''}
                    </div>
                    ${exibirAcoes ? `
                    <div class="agenda-acoes">
                        <button class="btn-acao btn-confirmar" onclick="atualizarStatus(${item.id}, 'Confirmado')">
                            <i class="fa-solid fa-check"></i> Confirmar
                        </button>
                        <button class="btn-acao btn-cancelar" onclick="atualizarStatus(${item.id}, 'Cancelado')">
                            <i class="fa-solid fa-xmark"></i> Cancelar
                        </button>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        // Salva a alteração de status (Confirmar/Cancelar) diretamente no Supabase!
        async function atualizarStatus(id, novoStatus) {
            try {
                const { error } = await supabase
                    .from('agendamentos')
                    .update({ status: novoStatus })
                    .eq('id', id);

                if (error) throw error;

                alert(`Agendamento ${novoStatus.toLowerCase()} com sucesso!`);
                carregarDadosDoBanco(); 
            } catch (err) {
                console.error("Erro ao atualizar status:", err.message);
                alert("Erro ao salvar alteração. Tente novamente.");
            }
        }
    </script>
