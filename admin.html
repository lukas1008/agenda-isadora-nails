<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Isadora Nails</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #000000;
            border-bottom: 3px solid #0056b3;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            color: #007bff;
            letter-spacing: 1px;
        }
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #2d2d2d;
        }
        h2 {
            color: white;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #2d2d2d;
            font-size: 14px;
        }
        th {
            background-color: #121212;
            color: #007bff;
        }
        .status-pendente {
            color: #ffc107;
            font-weight: bold;
        }
        .btn-acao {
            padding: 6px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
            font-weight: bold;
        }
        .btn-aprovar { 
            background-color: #28a745; 
            color: white; 
        }
        .btn-aprovar:hover {
            background-color: #218838;
        }
        .btn-cancelar { 
            background-color: #dc3545; 
            color: white; 
        }
        .btn-cancelar:hover {
            background-color: #c82333;
        }
        
        .menu-admin {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .menu-admin a {
            text-decoration: none;
            color: #aaa;
            font-size: 14px;
            padding: 8px 15px;
            border: 1px solid #2d2d2d;
            background-color: #121212;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .menu-admin a:hover {
            color: white;
            border-color: #007bff;
            background-color: #007bff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Painel Administrativo</h1>
    </header>

    <div class="admin-container">
        <div class="menu-admin">
            <a href="index.html">Sair</a>
            <a href="#">Configurações</a>
            <a href="#">Clientes</a>
        </div>

        <h2>Agendamentos do Dia</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Serviço</th>
                    <th>Horário</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Maria Oliveira</td>
                    <td>Manicure</td>
                    <td>09:00</td>
                    <td class="status-pendente">Pendente</td>
                    <td>
                        <button class="btn-acao btn-aprovar">Ok</button>
                        <button class="btn-acao btn-cancelar">X</button>
                    </td>
                </tr>
                <tr>
                    <td>Ana Souza</td>
                    <td>Unha Postiça</td>
                    <td>10:30</td>
                    <td class="status-pendente">Pendente</td>
                    <td>
                        <button class="btn-acao btn-aprovar">Ok</button>
                        <button class="btn-acao btn-cancelar">X</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
