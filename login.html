<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora Nails - Entrar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #2d2d2d;
            text-align: center;
        }
        h2 {
            color: #007bff;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #2d2d2d;
            background-color: #121212;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        .btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .signup-link {
            display: block;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }
        .signup-link strong {
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Acesse sua Conta</h2>
        <p>Identifique-se para agendar seu horário</p>
        
        <form id="loginForm">
            <input type="text" id="nome" placeholder="Seu Nome Completo" required>
            <input type="tel" id="whatsapp" placeholder="Seu WhatsApp (ex: 88999999999)" required pattern="[0-9]{10,11}">
            <input type="email" id="email" placeholder="Seu E-mail" required>
            <input type="password" id="senha" placeholder="Sua Senha" required>
            <button type="submit" class="btn">Entrar</button>
        </form>

        <a href="#" class="signup-link">Não tem conta? <strong>Cadastre-se</strong></a>
    </div>

    <script>
        window.onload = function() {
            const usuarioLogado = localStorage.getItem("usuarioLogado");
            
            if (usuarioLogado) {
                if (usuarioLogado === "isadoragomes.luk@gmail.com") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "agendar.html";
                }
            }
        };

        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const nomeInput = document.getElementById("nome").value.trim();
            const whatsappInput = document.getElementById("whatsapp").value.trim();
            const emailInput = document.getElementById("email").value.trim().toLowerCase();
            const senhaInput = document.getElementById("senha").value;

            // Suas novas credenciais oficiais
            const emailAdmin = "isadoragomes.luk@gmail.com";
            const senhaAdmin = "lukisa1008";

            if (emailInput === emailAdmin && senhaInput === senhaAdmin) {
                localStorage.setItem("usuarioLogado", emailInput);
                localStorage.setItem("nomeUsuario", "Isadora Admin");
                localStorage.setItem("whatsappUsuario", "");
                window.location.href = "admin.html";
            } else {
                localStorage.setItem("usuarioLogado", emailInput);
                localStorage.setItem("nomeUsuario", nomeInput);
                localStorage.setItem("whatsappUsuario", whatsappInput);
                window.location.href = "agendar.html";
            }
        });
    </script>

</body>
</html>
