<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora Nails - Entrar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h2 {
            color: #ff69b4;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .links {
            margin-top: 15px;
            font-size: 14px;
        }
        .links a {
            color: #ff69b4;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Acesse sua Conta</h2>
        <form action="agendar.html">
            <input type="email" placeholder="Seu E-mail" required>
            <input type="password" placeholder="Sua Senha" required>
            <button type="submit" class="btn">Entrar</button>
        </form>
        
        <div class="links">
            <p>Ainda não tem conta? <a href="#">Cadastre-se</a></p>
            <p><a href="index.html">Voltar para o início</a></p>
        </div>
    </div>

</body>
</html>
