<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora Nails - Agenda</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212; 
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        header {
            background-color: #000000; 
            border-bottom: 3px solid #0056b3;
            color: white;
            padding: 30px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
            color: #007bff;
        }
        header p {
            margin: 5px 0 0 0;
            color: #aaa;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #2d2d2d;
        }
        h2 {
            color: white;
            margin-top: 0;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 10px;
        }
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 14px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .servico {
            border-bottom: 1px solid #2d2d2d;
            padding: 15px 0;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }
        .servico strong {
            color: #007bff;
        }
        .preco {
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>ISADORA NAILS</h1>
        <p>Agendamento Prático & Rápido</p>
    </header>

    <div class="container">
        <h2>Nossos Serviços</h2>
        
        <div class="servico">
            <span>💅 <strong>Manicure</strong></span>
            <span class="preco">R$ 27,00</span>
        </div>
        <div class="servico">
            <span>🦶 <strong>Pedicure</strong></span>
            <span class="preco">R$ 33,00</span>
        </div>
        <div class="servico">
            <span>🔄 <strong>Manicure + Pedicure</strong></span>
            <span class="preco">R$ 60,00</span>
        </div>
        <div class="servico">
            <span>✨ <strong>Unha Postiça</strong></span>
            <span class="preco">R$ 30,00</span>
        </div>

        <a href="login.html" class="btn">Agendar um Horário</a>
    </div>

</body>
</html>
