<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora Nails - Agendamento</title>
    <style>
        body {
            background-color: #0b0d17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px 16px;
            margin: 0;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
        }

        h2 { font-size: 24px; margin-bottom: 5px; }
        p { color: #64748b; font-size: 14px; margin-top: 0; margin-bottom: 25px; }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #94a3b8;
        }

        input, select {
            width: 100%;
            padding: 14px;
            background-color: #111422;
            border: 1px solid #1e2235;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        /* Grade de Horários Elegante */
        .horarios-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .horario-card {
            background-color: #111422;
            border: 1px solid #1e2235;
            padding: 12px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #e2e8f0;
        }

        .horario-card.selected {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            border-color: transparent;
            color: #ffffff;
        }

        .horario-card.ocupado {
            background-color: #1c1f30;
            border-color: #262b44;
            color: #475569;
            text-decoration: line-through;
            cursor: not-allowed;
            opacity: 0.4;
        }

        .btn-confirmar {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }

        .aviso-erro {
            color: #ef4444;
            font-size: 13px;
            margin-top: -15px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Agende seu Horário</h2>
        <p>Escolha o procedimento e o melhor momento para você</p>

        <!-- Nome da Cliente -->
        <label for="nome">Seu Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome completo">

        <!-- Seleção de Serviço -->
        <label for="servico">Escolha o Serviço</label>
        <select id="servico">
            <option value="Manicure + Pedicure|60.00">Manicure + Pedicure - R$ 60,00</option>
            <option value="Alongamento em Gel|100.00">Alongamento em Gel - R$ 100,00</option>
            <option value="Manutenção em Gel|80.00">Manutenção em Gel - R$ 80,00</option>
        </select>

        <!-- Escolha da Data -->
        <label for="data">Escolha o Dia</label>
        <input type="date" id="data" onchange="verificarHorariosDisponiveis()">
        <div id="erro-domingo" class="aviso-erro">❌ Não atendemos aos domingos. Por favor, escolha outra data!</div>

        <!-- Grade de Horários das 13h às 19h -->
        <label>Horários Disponíveis (13:00 às 19:00)</label>
        <div class="horarios-grid" id="container-horarios">
            <!-- Gerado via JavaScript -->
        </div>

        <button class="btn-confirmar" onclick="salvarEIrProZap()">Confirmar Agendamento ⚡</button>
    </div>

    <script>
        const DB_URL = "https://htdgxhgnjiqvktunspbx.supabase.co";
        const DB_KEY = "sb_publishable_17WMOi7ShX6Mhe_LJT-mwg_Gheub-a3";
        const WHATSAPP_NUMERO = "5588999999999"; // Substitua pelo seu número oficial com DDD se necessário

        // Lista restrita de turnos (13h às 19h)
        const turnosExpediente = ["13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];
        let horarioSelecionado = "";

        // Bloqueia domingos e gera os horários iniciais ao carregar
        window.onload = function() {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('data').min = hoje;
            renderizarGradeHorarios([]);
        };

        function renderizarGradeHorarios(horariosOcupados) {
            const container = document.getElementById('container-horarios');
            container.innerHTML = "";

            turnosExpediente.forEach(hora => {
                const card = document.createElement('div');
                card.className = 'horario-card';
                card.innerText = hora;

                // Se o horário já estiver salvo no banco para aquele dia, ele fica bloqueado
                if (horariosOcupados.includes(hora)) {
                    card.classList.add('ocupado');
                } else {
                    card.onclick = function() {
                        document.querySelectorAll('.horario-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        horarioSelecionado = hora;
                    };
                }
                container.appendChild(card);
            });
        }

        // Verifica os horários já tomados no Supabase e bloqueia Domingos
        async function verificarHorariosDisponiveis() {
            const campoData = document.getElementById('data').value;
            const erroDomingo = document.getElementById('erro-domingo');
            
            if (!campoData) return;

            // Validação de Domingo
            const diaDaSemana = new Date(campoData + 'T00:00:00').getDay();
            if (diaDaSemana === 0) {
                erroDomingo.style.display = 'block';
                document.getElementById('data').value = "";
                renderizarGradeHorarios([]);
                return;
            } else {
                erroDomingo.style.display = 'none';
            }

            try {
                // Busca horários agendados neste dia específico
                const res = await fetch(`${DB_URL}/rest/v1/agendamentos?data=eq.${campoData}&select=horario`, {
                    method: 'GET',
                    headers: { 'apikey': DB_KEY, 'Authorization': `Bearer ${DB_KEY}` }
                });
                const lista = await res.json();
                const ocupados = lista.map(item => item.horario);
                
                renderizarGradeHorarios(ocupados);
            } catch (err) {
                console.error("Erro ao verificar horários:", err);
                renderizarGradeHorarios([]);
            }
        }

        // Envia instantaneamente ao banco e abre o WhatsApp
        async function salvarEIrProZap() {
            const nome = document.getElementById('nome').value.trim();
            const servicoCompleto = document.getElementById('servico').value.split('|');
            const dataVal = document.getElementById('data').value;

            if (!nome || !dataVal || !horarioSelecionado) {
                alert("Por favor, preencha seu nome, selecione o dia e o horário!");
                return;
            }

            const nomeServico = servicoCompleto[0];
            const precoServico = `R$ ${servicoCompleto[1].replace('.', ',')}`;
            const dataFormatada = dataVal.split('-').reverse().join('/');

            // Criação do objeto para o banco
            const dadosAgendamento = {
                cliente_nome: nome,
                servico: nomeServico,
                data: dataVal,
                horario: horarioSelecionado,
                preco: precoServico
            };

            // Envio em segundo plano (Background) para não travar a experiência da cliente
            fetch(`${DB_URL}/rest/v1/agendamentos`, {
                method: 'POST',
                headers: { 
                    'apikey': DB_KEY, 
                    'Authorization': `Bearer ${DB_KEY}`, 
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(dadosAgendamento)
            }).catch(e => console.error("Erro em background:", e));

            // Feedback visual rápido e redirecionamento direto sem atraso
            alert("Agendamento Solicitado! Abrindo seu WhatsApp para confirmação... ✨");

            const mensagemZap = `Olá Isadora! Gostaria de confirmar meu agendamento:%0A%0A👤 *Nome:* ${nome}%0A💅 *Serviço:* ${nomeServico}%0A📅 *Data:* ${dataFormatada}%0A🕒 *Horário:* ${horarioSelecionado}%0A💵 *Valor:* ${precoServico}`;
            window.location.href = `https://wa.me/${WHATSAPP_NUMERO}?text=${mensagemZap}`;
        }
    </script>
</body>
</html>
