<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora Nails - Agendar</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 10px; }
        h2 { color: #007bff; text-align: center; }
        label { display: block; margin-top: 15px; color: white; }
        select, input { width: 100%; padding: 12px; margin-top: 5px; background: #121212; color: white; border: 1px solid #2d2d2d; border-radius: 5px; }
        .btn { width: 100%; background-color: #007bff; color: white; border: none; padding: 14px; margin-top: 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Agendar Horário</h2>
        <form id="formAgendamento">
            <label>Serviço:</label>
            <select id="servico" required>
                <option value="Manicure">Manicure - R$ 27,00</option>
                <option value="Pedicure">Pedicure - R$ 33,00</option>
                <option value="Manicure + Pedicure">Manicure + Pedicure - R$ 60,00</option>
            </select>
            <label>Data:</label>
            <input type="date" id="data" required>
            <label>Horário:</label>
            <select id="hora" required>
                <option value="13:00">13:00</option>
                <option value="14:30">14:30</option>
                <option value="16:00">16:00</option>
            </select>
            <button type="submit" class="btn">Confirmar Agendamento</button>
        </form>
    </div>

    <script>
        document.getElementById('formAgendamento').addEventListener('submit', function(e) {
            e.preventDefault();
            const agendamento = {
                servico: document.getElementById('servico').value,
                data: document.getElementById('data').value,
                hora: document.getElementById('hora').value,
                cliente: localStorage.getItem('nomeUsuario')
            };
            
            // Salva localmente
            let lista = JSON.parse(localStorage.getItem('agendamentos') || '[]');
            lista.push(agendamento);
            localStorage.setItem('agendamentos', JSON.stringify(lista));
            
            alert('Agendado com sucesso!');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
