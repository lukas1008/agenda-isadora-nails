<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora Nails - Agendar</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 10px; border: 1px solid #2d2d2d; }
        h2 { color: #007bff; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: white; }
        select, input { width: 100%; padding: 12px; border: 1px solid #2d2d2d; background-color: #121212; color: white; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn-confirmar { width: 100%; background-color: #007bff; color: white; border: none; padding: 14px; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 25px; }
        .btn-confirmar:hover { background-color: #0056b3; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #aaa; text-decoration: none; font-size: 14px; cursor: pointer; border: none; background: none; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Escolha seu Horário</h2>
        
        <form id="agendamentoForm">
            <label for="servico">Selecione o Serviço:</label>
            <select id="servico" required>
                <option value="">Selecione...</option>
                <option value="💅 Manicure - R$ 27,00">💅 Manicure - R$ 27,00</option>
                <option value="🦶 Pedicure - R$ 33,00">🦶 Pedicure - R$ 33,00</option>
                <option value="🔄 Manicure + Pedicure - R$ 60,00">🔄 Manicure + Pedicure - R$ 60,00</option>
                <option value="✨ Unha Postiça - R$ 30,00">✨ Unha Postiça - R$ 30,00</option>
            </select>

            <label for="data">Escolha a Data:</label>
            <input type="date" id="data" required>

            <label for="hora">Escolha o Horário:</label>
            <select id="hora" required>
                <option value="">Selecione...</option>
                <option value="13:00">13:00</option>
                <option value="14:30">14:30</option>
                <option value="16:00">16:00</option>
                <option value="17:30">17:30</option>
                <option value="19:00">19:00</option>
            </select>

            <button type="submit" class="btn-confirmar">Confirmar & Enviar no WhatsApp</button>
        </form>

        <button onclick="fazerLogout()" class="back-link">Sair / Voltar ao Início</button>
    </div>

    <script>
        const SUPABASE_URL = "https://htdgxhgnjiqvktunspbx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_17WMOi7ShX6Mhe_LJT-mwg_Gheub-a3";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: false }
        });

        function fazerLogout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.onload = function() {
            if (!localStorage.getItem("usuarioLogado")) {
                window.location.href = "login.html";
                return;
            }
            const hoje = new Date();
            const yyyy = hoje.getFullYear();
            const mm = String(hoje.getMonth() + 1).padStart(2, '0');
            const dd = String(hoje.getDate()).padStart(2, '0');
            document.getElementById("data").setAttribute("min", `${yyyy}-${mm}-${dd}`);
        };

        document.getElementById("agendamentoForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const nomeCliente = localStorage.getItem("nomeUsuario") || "Cliente";
            const emailCliente = localStorage.getItem("usuarioLogado") || "nao@informado.com";
            const whatsappCliente = localStorage.getItem("whatsappUsuario") || "";
            const servicoCompleto = document.getElementById("servico").value;
            const data = document.getElementById("data").value;
            const hora = document.getElementById("hora").value;
            const dataFormatada = data.split("-").reverse().join("/");

            const partesServico = servicoCompleto.split(" - ");
            const servicoNome = partesServico[0] || servicoCompleto;
            const servicoPreco = partesServico[1] || "";

            try {
                const { error: erroInsercao } = await _supabase
                    .from('agendamentos')
                    .insert([{
                        cliente_nome: nomeCliente,
                        cliente_email: emailCliente,
                        servico: servicoNome,
                        preco: servicoPreco,
                        data: dataFormatada,
                        horario: hora,
                        whatsapp: whatsappCliente
                    }]);

                if (erroInsercao) throw erroInsercao;

                alert("Agendamento salvo com sucesso!");

                const telefoneDona = "5588981215376";
                const textoMensagem = encodeURIComponent(
                    `Olá Isadora! Meu nome é ${nomeCliente}.\n` +
                    `Confirmei meu agendamento pelo site:\n\n` +
                    `💅 *Serviço:* ${servicoCompleto}\n` +
                    `📅 *Data:* ${dataFormatada}\n` +
                    `🕒 *Horário:* ${hora}\n` +
                    `📱 *WhatsApp:* ${whatsappCliente}`
                );

                window.open(`https://wa.me/${telefoneDona}?text=${textoMensagem}`, "_blank");
                window.location.href = "index.html";

            } catch (err) {
                console.error(err);
                alert("Ocorreu um erro ao tentar salvar o seu agendamento no servidor. Por favor, tente novamente.");
            }
        });
    </script>
</body>
</html>
