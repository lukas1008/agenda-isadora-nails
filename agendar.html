<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isadora Nails - Agendar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #2d2d2d;
        }
        h2 {
            color: #007bff;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: white;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #2d2d2d;
            background-color: #121212;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        select:focus, input:focus {
            border-color: #007bff;
            outline: none;
        }
        .btn-confirmar {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.3s;
        }
        .btn-confirmar:hover {
            background-color: #0056b3;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
        }
        .back-link:hover {
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Escolha seu Horário</h2>
        
        <form id="agendamentoForm">
            <!-- Seleção de Serviço -->
            <label for="servico">Selecione o Serviço:</label>
            <select id="servico" required>
                <option value="">Selecione...</option>
                <option value="💅 Manicure - R$ 27,00">💅 Manicure - R$ 27,00</option>
                <option value="🦶 Pedicure - R$ 33,00">🦶 Pedicure - R$ 33,00</option>
                <option value="🔄 Manicure + Pedicure - R$ 60,00">🔄 Manicure + Pedicure - R$ 60,00</option>
                <option value="✨ Unha Postiça - R$ 30,00">✨ Unha Postiça - R$ 30,00</option>
            </select>

            <!-- Seleção de Data -->
            <label for="data">Escolha a Data:</label>
            <input type="date" id="data" required>

            <!-- Seleção de Horário -->
            <label for="hora">Escolha o Horário:</label>
            <select id="hora" required>
                <option value="">Selecione...</option>
                <option value="09:00">09:00</option>
                <option value="10:30">10:30</option>
                <option value="13:00">13:00</option>
                <option value="14:30">14:30</option>
                <option value="16:00">16:00</option>
            </select>

            <button type="submit" class="btn-confirmar">Confirmar Agendamento</button>
        </form>

        <button onclick="fazerLogout()" class="back-link">Sair / Voltar ao Início</button>
    </div>

    <script>
        // Função de Logout
        function fazerLogout() {
            localStorage.removeItem("usuarioLogado");
            window.location.href = "index.html";
        }

        // Segurança extra: se alguém tentar acessar sem estar logado, joga pro login
        window.onload = function() {
            if (!localStorage.getItem("usuarioLogado")) {
                window.location.href = "login.html";
            }
        };

        // Lógica para Salvar o Agendamento
        document.getElementById("agendamentoForm").addEventListener("submit", function(event) {
            event.preventDefault();

            // Pega quem é o usuário que está logado fazendo a marcação
            const cliente = localStorage.getItem("usuarioLogado");
            const servico = document.getElementById("servico").value;
            const data = document.getElementById("data").value;
            const hora = document.getElementById("hora").value;

            // Formata a data de AAAA-MM-DD para DD/MM/AAAA para ficar mais amigável
            const dataFormatada = data.split("-").reverse().join("/");

            // Cria um objeto com as informações do agendamento
            const novoAgendamento = {
                id: Date.now(), // gera um ID único usando a hora atual
                cliente: cliente,
                servico: servico,
                data: dataFormatada,
                hora: hora,
                status: "Pendente"
            };

            // Busca os agendamentos já existentes ou cria uma lista vazia se for o primeiro
            let listaAgendamentos = JSON.parse(localStorage.getItem("agendamentos")) || [];
            
            // Adiciona o novo na lista
            listaAgendamentos.push(novoAgendamento);

            // Salva a lista atualizada de volta no navegador
            localStorage.setItem("agendamentos", JSON.stringify(listaAgendamentos));

            // Feedback visual de sucesso!
            alert(`Sucesso! Seu agendamento de ${servico} para o dia ${dataFormatada} às ${hora} foi registrado.`);
            
            // Limpa o formulário após salvar
            document.getElementById("agendamentoForm").reset();
        });
    </script>

</body>
</html>
